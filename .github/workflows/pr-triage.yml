name: PR triage
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const repo = context.repo
            const issue = { ...repo, issue_number: pr.number }
            const { data: vouches } = await github.rest.repos.getContent({
              ...repo, path: '.github/VOUCHED.td'
            })
            const author = pr.user.login.toLowerCase()
            let trust = 'unvouched'
            for (const line of Buffer.from(vouches.content, 'base64').toString('utf8').split(/\r?\n/)) {
              const entry = /^(-?)github:([\w-]+)(?:\s.*)?$/i.exec(line.trim())
              if (entry?.[2].toLowerCase() === author) trust = entry[1] ? 'denounced' : 'trusted'
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo, pull_number: pr.number, per_page: 100
            })
            if (files.length >= 3000) throw new Error('GitHub capped the PR file list')
            const lines = files.reduce((sum, file) => sum + file.additions + file.deletions, 0)
            const size = [[9, 'XS'], [29, 'S'], [99, 'M'], [499, 'L'], [999, 'XL']]
              .find(([limit]) => lines <= limit)?.[1] ?? 'XXL'
            const areas = new Map([
              ['docs/site/content/', 'docs'], ['docs/site/', 'web'], ['docs/', 'docs'],
              ['skills/', 'docs'], ['src/', 'cli'], ['distribution/', 'release'],
              ['packaging/', 'release'], ['.github/', 'ci']
            ])
            const labels = new Set([`vouch:${trust}`, `size:${size}`])
            for (const file of files) {
              for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                for (const [prefix, area] of areas) {
                  if (!path.startsWith(prefix)) continue
                  labels.add(`area:${area}`)
                  break
                }
              }
            }
            const managed = /^(vouch:(trusted|unvouched|denounced)|size:(XS|S|M|L|XL|XXL)|area:(docs|web|cli|release|ci))$/
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, issue)
            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  ...repo, name, color: name.startsWith('vouch:') ? 'd4c5f9' : 'bfdadc'
                })
              } catch (error) {
                if (error.status !== 422 || !error.response?.data?.errors?.some(item => item.code === 'already_exists')) throw error
              }
            }
            await github.rest.issues.addLabels({ ...issue, labels: [...labels] })
            for (const { name } of current) {
              if (managed.test(name) && !labels.has(name)) {
                await github.rest.issues.removeLabel({ ...issue, name })
              }
            }
