name: Contributor attribution
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  credit:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr.number
            })
            const logins = new Set([pr.user.login])
            for (const commit of commits) {
              if (commit.author?.login) logins.add(commit.author.login)
            }
            const contributors = [...logins]
              .filter(login => /^[a-z0-9-]+$/i.test(login))
              .map(login => `@${login}`)
            if (contributors.length) {
              const marker = '<!-- prex-attribution -->'
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: pr.number
              })
              if (comments.some(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker))) return
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number,
                body: `${marker}\nContributors to this merged change: ${contributors.join(', ')}.`
              })
            }
